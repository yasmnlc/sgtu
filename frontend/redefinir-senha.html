<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGTU - Redefinir Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8 space-y-4 border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-blue-950">Nova Senha</h2>
            <p class="text-xs text-gray-500 mt-1">Insira a sua nova senha de acesso ao sistema.</p>
        </div>

        <form id="form-nova-senha" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nova Senha</label>
                <input type="password" id="nova-senha" placeholder="Mínimo 6 caracteres" required minlength="6"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-blue-900">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Confirmar Nova Senha</label>
                <input type="password" id="confirmar-senha" placeholder="Repita a senha" required minlength="6"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-blue-900">
            </div>

            <button type="submit" class="w-full bg-blue-950 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-opacity-95 transition-all text-sm">
                Atualizar Senha
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert("Token de recuperação ausente ou inválido.");
            window.location.href = 'login.html';
        }

        document.getElementById('form-nova-senha').addEventListener('submit', async function(e) {
            e.preventDefault();
            const novaSenha = document.getElementById('nova-senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;

            if (novaSenha !== confirmarSenha) {
                return alert("As senhas não coincidem.");
            }

            try {
                const response = await fetch(`${API_BASE_URL}/redefinir-senha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, nova_senha: novaSenha })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensagem);
                    window.location.href = 'login.html';
                } else {
                    alert(`Erro: ${data.detail}`);
                }
            } catch (error) {
                alert("Erro ao conectar com o servidor.");
            }
        });
    </script>
</body>
</html>
